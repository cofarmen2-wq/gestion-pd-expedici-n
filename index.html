<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Mercadería</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    .logo-cofar {
      max-height: 45px;
      width: auto;
      object-fit: contain;
      transition: transform 0.3s ease, filter 0.3s ease;
      cursor: pointer;
    }
    .logo-cofar:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
    }

    .view-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
      padding: 6px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .view-switch {
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .view-switch.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(99, 102, 241, 0.14));
      color: var(--primary);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.18);
    }

    .tab-panel {
      display: block;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="logo-box">
      <img src="LOGO%20COFAR.png" alt="Logo COFAR" class="logo-cofar">
    </div>
    <div class="title-box">
      <h2>Logística Puesta a Disposición</h2>
      <span id="turnoBadge" class="badge">TURNO -</span>
    </div>
    <button type="button" class="btn-drawer-open" id="btnOpenDrawer">☰ Historial</button>
  </header>

  <main class="container">
    <form id="mainForm">
      <div class="card">
        <div class="view-switcher" role="tablist" aria-label="Pestañas de registro">
          <button type="button" class="view-switch active" data-vista="SALIDA" aria-pressed="true" role="tab" aria-selected="true" aria-controls="vistaSalida" id="tabSalida">
            Documento de salida
          </button>
          <button type="button" class="view-switch" data-vista="INGRESO" aria-pressed="false" role="tab" aria-selected="false" aria-controls="vistaIngreso" id="tabIngreso">
            Documentación ingreso
          </button>
        </div>

        <div id="vistaSalida" class="tab-panel" role="tabpanel" aria-labelledby="tabSalida">
          <div class="form-group">
            <label for="operario">Operario</label>
            <input type="text" id="operario" list="operariosLista" placeholder="Ingrese el operario..." required>
          </div>

          <div class="form-group">
            <label for="ruta">Ruta de Reparto</label>
            <select id="ruta" required>
              <option value="" disabled selected>Seleccione ruta...</option>
            </select>
          </div>

          <div class="form-group metric-grid">
            <div>
              <label for="cantidadCubetas">Cantidad de cubetas</label>
              <input type="number" id="cantidadCubetas" min="0" value="0">
            </div>
            <div>
              <label for="cantidadCadenasFrio">Cantidad de cadenas de frío</label>
              <input type="number" id="cantidadCadenasFrio" min="0" value="0">
            </div>
            <div>
              <label for="cantidadBultos">Cantidad de bultos</label>
              <input type="number" id="cantidadBultos" min="0" value="0">
            </div>
          </div>
        </div>

        <div id="vistaIngreso" class="tab-panel hidden" role="tabpanel" aria-labelledby="tabIngreso">
          <div class="form-group">
            <label for="operarioIngreso">Operario</label>
            <input type="text" id="operarioIngreso" list="operariosLista" placeholder="Ingrese el operario..." required>
          </div>
        </div>
      </div>

      <div class="card scan-card">
        <h3>Escaneo de Documentación QR</h3>
        <button type="button" id="btnToggleCamara" class="btn-camera">📷 Iniciar Escáner QR</button>

        <div id="reader-container" class="reader-container hidden">
          <div id="reader"></div>
        </div>

        <div id="loadingBarContainer" class="loading-overlay hidden" aria-live="polite">
          <div class="loading-card">
            <div class="loading-spinner"></div>
            <div id="loadingBarText" class="loading-title">Cargando datos</div>
            <div id="loadingBarPercent" class="loading-subtitle">procesando lote...</div>
          </div>
        </div>

        <div class="scanned-list-box">
          <h4>Documentos en Lote (<span id="countDocs">0</span>)</h4>
          <ul id="listaDocs" class="doc-list"></ul>
        </div>

        <div class="transfer-toggle">
          <label>
            <input type="checkbox" id="checkEsTransfer"> ¿Es Documentación TRANSFER?
          </label>
        </div>
      </div>

      <button type="submit" id="btnGuardar" class="btn-submit">FINALIZAR REGISTRO</button>
    </form>
  </main>

  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="drawer" class="drawer hidden">
    <div class="drawer-header">
      <h3>Historial Reciente</h3>
      <button id="btnCloseDrawer" class="btn-close">✕</button>
    </div>

    <div id="historialContent" class="drawer-body">
      <p class="loading-text">Cargando datos...</p>
    </div>
  </aside>

  <datalist id="operariosLista"></datalist>

  <script src="script.js"></script>
</body>
</html>
