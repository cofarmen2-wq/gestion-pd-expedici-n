<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Mercadería</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    .logo-cofar {
      max-height: 45px;
      width: auto;
      object-fit: contain;
      transition: transform 0.3s ease, filter 0.3s ease;
      cursor: pointer;
    }
    .logo-cofar:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      color: #ffffff;
    }
    .loading-overlay.hidden {
      display: none !important;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.2);
      border-top: 5px solid #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Overlay de Carga Visual -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <h3 id="loadingText">Registrando lote en Google Sheets...</h3>
  </div>

  <!-- Barra Superior -->
  <header class="top-bar">
    <div class="logo-box">
      <img src="LOGO%20COFAR.png" alt="Logo COFAR" class="logo-cofar">
    </div>
    <div class="title-box">
      <h2>Logística Puesta a Disposición</h2>
      <span id="turnoBadge" class="badge">TURNO -</span>
    </div>
    <button type="button" class="btn-drawer-open" id="btnOpenDrawer">☰ Historial</button>
  </header>

  <main class="container">
    <form id="mainForm">
      
      <!-- Controles Principales -->
      <div class="card">
        <div class="form-group">
          <label for="operario">Operario de Ingreso</label>
          <select id="operario" required>
            <option value="" disabled selected>Seleccione operario...</option>
            <option value="Operario 1">Operario 1</option>
            <option value="Operario 2">Operario 2</option>
            <option value="Operario 3">Operario 3</option>
            <option value="Operario 4">Operario 4</option>
          </select>
        </div>

        <div class="form-group">
          <label for="ruta">Ruta de Reparto</label>
          <select id="ruta" required>
            <option value="" disabled selected>Seleccione ruta...</option>
          </select>
        </div>
      </div>

      <!-- Zona de Escaneo Múltiple -->
      <div class="card scan-card">
        <h3>Escaneo de Documentación QR</h3>
        <div class="scan-type-selector">
          <label><input type="radio" name="tipoDoc" value="SALIDA" checked> Doc. Salida</label>
          <label><input type="radio" name="tipoDoc" value="INGRESO"> Doc. Ingreso</label>
        </div>

        <button type="button" id="btnToggleCamara" class="btn-camera">📷 Iniciar Escáner QR</button>
        <div id="reader-container" class="reader-container hidden">
          <div id="reader"></div>
        </div>

        <div class="transfer-toggle">
          <label>
            <input type="checkbox" id="checkEsTransfer"> Marcar Próximo Escaneo como TRANSFER
          </label>
        </div>

        <!-- Lista de Documentos Escaneados en Cola -->
        <div class="scanned-list-box">
          <h4>Documentos en Lote (<span id="countDocs">0</span>)</h4>
          <ul id="listaDocs" class="doc-list"></ul>
        </div>
      </div>

      <!-- Botón de Guardado -->
      <button type="submit" id="btnGuardar" class="btn-submit">GUARDAR Y REGISTRAR LOTE</button>

    </form>
  </main>

  <!-- Drawer Lateral Historial -->
  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="drawer" class="drawer hidden">
    <div class="drawer-header">
      <h3>Historial Reciente</h3>
      <button id="btnCloseDrawer" class="btn-close">✕</button>
    </div>
    <div id="historialContent" class="drawer-body">
      <p class="loading-text">Cargando datos...</p>
    </div>
  </aside>

  <!-- Modal Push Checklist para TRANSFER -->
  <div id="modalTransfer" class="modal-backdrop hidden">
    <div class="modal">
      <h3>Checklist Documentación TRANSFER</h3>
      <p id="transferDocLabel" class="doc-badge-modal"></p>
      
      <div class="checklist-group">
        <label>1. ¿Firma y sello correctos?
          <select id="chk1"><option value="SI">SI</option><option value="NO">NO</option></select>
        </label>
        <label>2. ¿Estado de la carga verificado?
          <select id="chk2"><option value="SI">SI</option><option value="NO">NO</option></select>
        </label>
        <label>3. ¿Número de precinto coincide?
          <select id="chk3"><option value="SI">SI</option><option value="NO">NO</option></select>
        </label>
      </div>

      <button type="button" id="btnConfirmTransfer" class="btn-submit">Confirmar Documento Transfer</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
