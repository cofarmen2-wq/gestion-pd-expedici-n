<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Mercadería - Puesta a Disposición</title>
  <?!= include('style'); ?>
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <h1>Logística Puesta a Disposición</h1>
      <div class="turno-badge" id="turnoBadge">TURNO: <span id="turnoTexto">CARGANDO...</span></div>
    </div>
    <button class="btn-historial" onclick="abrirHistorial()">📋 Historial</button>
  </header>

  <main class="main-container">
    <div class="view-selector">
      <button id="btnVistaLote" class="view-btn active" onclick="cambiarVista('lote')">Puesta a Disposición (Salida)</button>
      <button id="btnVistaIngreso" class="view-btn" onclick="cambiarVista('ingreso')">Documentación de Ingreso</button>
    </div>

    <!-- SECCIÓN 1: PUESTA A DISPOSICIÓN (LOTE) -->
    <section id="seccionLote" class="form-section">
      <div class="input-group">
        <label for="operarioInput">Operario de Ingreso</label>
        <select id="operarioInput" class="form-control">
          <option value="">Seleccione operario...</option>
          <option value="Operario 1">Operario 1</option>
          <option value="Operario 2">Operario 2</option>
          <option value="Operario 3">Operario 3</option>
          <option value="Supervisor">Supervisor</option>
        </select>
      </div>

      <div class="input-group">
        <label for="turnoSelect">Turno</label>
        <select id="turnoSelect" class="form-control" onchange="actualizarRutasPorTurno()">
          <option value="MAÑANA">Mañana</option>
          <option value="TARDE">Tarde</option>
          <option value="NOCHE">Noche</option>
          <option value="FUERA DE TURNO">Fuera de Turno</option>
        </select>
      </div>

      <div class="input-group">
        <label for="rutaSelect">Ruta de Reparto</label>
        <select id="rutaSelect" class="form-control">
          <option value="">Seleccione ruta...</option>
        </select>
      </div>

      <div class="scanner-card">
        <h3>Escaneo de Documentación QR</h3>
        <div class="radio-group">
          <label><input type="radio" name="tipoEscaneo" value="salida" checked> Doc. Salida</label>
          <label><input type="radio" name="tipoEscaneo" value="ingreso"> Doc. Ingreso</label>
        </div>
        
        <button class="btn-primary" onclick="iniciarEscannerSalida()">📷 Iniciar Escáner QR</button>
        <div id="reader" class="hidden"></div>

        <div class="manual-input-row">
          <input type="text" id="codigoInput" class="form-control" placeholder="Ingrese o escanee código..." onkeypress="if(event.key === 'Enter') agregarDocumentoManual()">
          <button class="btn-secondary" onclick="agregarDocumentoManual()">Agregar</button>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" id="checkTransfer" onchange="toggleTransferencia()"> ¿Es Documentación TRANSFER?
        </label>
      </div>

      <div class="documents-list-container">
        <h3>Documentos en Lote (<span id="contadorDocs">0</span>)</h3>
        <ul id="listaDocumentos" class="doc-list"></ul>
      </div>

      <button class="btn-success-lg" onclick="enviarLote()">FINALIZAR REGISTRO</button>
    </section>

    <!-- SECCIÓN 2: DOCUMENTACIÓN DE INGRESO -->
    <section id="seccionIngreso" class="form-section hidden">
      <div class="scanner-card">
        <h3>Registro Rápido de Ingreso Unitario</h3>
        <button class="btn-primary" onclick="iniciarEscannerIngreso()">📷 Escanear Ingreso QR</button>
        <div id="readerIngreso" class="hidden"></div>

        <div class="manual-input-row">
          <input type="text" id="codigoIngresoInput" class="form-control" placeholder="Código de documento de salida..." onkeypress="if(event.key === 'Enter') registrarIngresoUnitario()">
          <button class="btn-success" onclick="registrarIngresoUnitario()">Registrar Ingreso</button>
        </div>
      </div>

      <div class="history-container">
        <h3>Historial Reciente</h3>
        <div id="historialRecienteLista"></div>
      </div>
    </section>
  </main>

  <!-- MODAL TRANSFERENCIA -->
  <div id="modalTransfer" class="modal hidden">
    <div class="modal-content">
      <h3>Configurar Transferencia: <span id="modalDocCode"></span></h3>
      <label>Origen:</label>
      <input type="text" id="transOrigen" class="form-control" value="CD Central">
      <label>Destino:</label>
      <input type="text" id="transDestino" class="form-control" value="Sucursal">
      <div class="modal-buttons">
        <button class="btn-secondary" onclick="cerrarModalTransferencia(false)">Cancelar</button>
        <button class="btn-primary" onclick="cerrarModalTransferencia(true)">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- OVERLAY DE CARGA -->
  <div id="loadingOverlay" class="overlay hidden">
    <div class="spinner"></div>
    <p id="loadingText">Procesando...</p>
  </div>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <?!= include('script'); ?>
</body>
</html>
